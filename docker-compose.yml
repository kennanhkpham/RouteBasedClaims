services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  auth-migrate:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/routebasedclaims-auth-service:1.0.1
    build:
      context: .
      dockerfile: Services/AuthService/Dockerfile
    entrypoint: ["./efbundle"]
    environment:
      ConnectionStrings__AuthDb: "Server=sql,1433;Initial Catalog=AuthDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  claims-migrate:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/routebasedclaims-claims-service:1.0.0
    build:
      context: .
      dockerfile: Services/ClaimsService/Dockerfile
    entrypoint: ["./efbundle"]
    environment:
      ConnectionStrings__ClaimsDb: "Server=sql,1433;Initial Catalog=ClaimsDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  clients-migrate:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/routebasedclaims-clients-service:1.0.0
    build:
      context: .
      dockerfile: Services/ClientsService/Dockerfile
    entrypoint: ["./efbundle"]
    environment:
      ConnectionStrings__ClientsDb: "Server=sql,1433;Initial Catalog=ClientsDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  auth-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/routebasedclaims-auth-service:1.0.1
    build:
      context: .
      dockerfile: Services/AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AuthDb: "Server=sql,1433;Initial Catalog=AuthDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      AdminBootstrap__Username: ${ADMIN_BOOTSTRAP_USERNAME:?Set ADMIN_BOOTSTRAP_USERNAME in .env}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD in .env}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  clients-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/routebasedclaims-clients-service:1.0.0
    build:
      context: .
      dockerfile: Services/ClientsService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ClientsDb: "Server=sql,1433;Initial Catalog=ClientsDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      ServiceAuth__ApiKey: ${CLIENTS_SERVICE_API_KEY:?Set CLIENTS_SERVICE_API_KEY in .env}
    depends_on:
      clients-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  claims-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/routebasedclaims-claims-service:1.0.1
    build:
      context: .
      dockerfile: Services/ClaimsService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ClaimsDb: "Server=sql,1433;Initial Catalog=ClaimsDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      ClientsService__BaseUrl: http://clients-service:8080
      ClientsService__ApiKey: ${CLIENTS_SERVICE_API_KEY:?Set CLIENTS_SERVICE_API_KEY in .env}
    depends_on:
      claims-migrate:
        condition: service_completed_successfully
      clients-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/claimstream-frontend:1.0.2
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:80"
    depends_on:
      auth-service:
        condition: service_started
      claims-service:
        condition: service_started
      clients-service:
        condition: service_started
    restart: unless-stopped

  api:
    profiles:
      - legacy
    image: routebasedclaims-api:local
    build:
      context: .
      dockerfile: InsuranceClaimApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Initial Catalog=RouteBasedClaimsDev;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      AdminBootstrap__Username: ${ADMIN_BOOTSTRAP_USERNAME:?Set ADMIN_BOOTSTRAP_USERNAME in .env}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    depends_on:
      sql:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles:
      - legacy-migrations
    image: routebasedclaims-api:local
    entrypoint: ["./efbundle"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Initial Catalog=RouteBasedClaimsDev;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

volumes:
  sql_data:
    external: true
    name: routebasedclaim_sql_data
