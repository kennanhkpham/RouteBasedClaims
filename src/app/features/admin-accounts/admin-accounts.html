<section class="accounts-page" aria-labelledby="accounts-title">
  <div class="page-heading">
    <p class="eyebrow">ADMINISTRATOR TOOLS</p>
    <h1 id="accounts-title">Create Admin Account</h1>
    <p class="intro">Create an administrator account for a trusted reviewer.</p>
  </div>

  <form class="account-card" (ngSubmit)="createAccount()">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      autocomplete="username"
      minlength="3"
      maxlength="50"
      pattern="[A-Za-z0-9._-]+"
      required
      [ngModel]="username()"
      (ngModelChange)="username.set($event)">

    <label for="password">Password</label>
    <div class="password-input">
      <input
        id="password"
        name="password"
        [type]="isPasswordVisible() ? 'text' : 'password'"
        autocomplete="new-password"
        minlength="12"
        maxlength="128"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)">
      <button
        class="visibility-button"
        type="button"
        [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="isPasswordVisible()"
        (click)="togglePasswordVisibility()">
        @if (isPasswordVisible()) {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 3 21 21M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c5.5 0 9 7 9 7a14 14 0 0 1-3.1 3.8M6.2 6.3C3.9 8 3 12 3 12s3.5 7 9 7a9.7 9.7 0 0 0 4.1-.9"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7Z"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7" />
          </svg>
        }
      </button>
    </div>

    <label for="confirm-password">Confirm password</label>
    <input
      id="confirm-password"
      name="confirmPassword"
      [type]="isPasswordVisible() ? 'text' : 'password'"
      autocomplete="new-password"
      minlength="12"
      maxlength="128"
      required
      [ngModel]="confirmPassword()"
      (ngModelChange)="confirmPassword.set($event)">

    <label for="department">Department</label>
    <input
      id="department"
      name="department"
      type="text"
      autocomplete="organization"
      maxlength="100"
      required
      placeholder="For example, Claims Review"
      [ngModel]="department()"
      (ngModelChange)="department.set($event)">

    @if (errorMessage()) {
      <p class="alert" role="alert">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="success" role="status">{{ successMessage() }}</p>
      <a class="return-link" routerLink="/review">Return to Claim Review</a>
    }

    <button class="submit-button" type="submit" [disabled]="isLoading()" [attr.aria-busy]="isLoading()">
      @if (isLoading()) {
        <span class="loading-spinner" aria-hidden="true"></span>
      }
      <span>{{ isLoading() ? 'Creating account…' : 'Create Admin Account' }}</span>
    </button>
  </form>
</section>
